[package]
name = "playtron-plugin-flatpak"
version = "1.0.0"
edition = "2021"
license = "GPL-2.0"
description = "Flatpak plugin for Playtron GameOS"

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/playtron-plugin-flatpak", dest = "/usr/bin/playtron-plugin-flatpak", mode = "755" },
  { source = "pluginmanifest.json", dest = "/usr/share/playtron/plugins/flatpak/pluginmanifest.json", mode = "644" },
  { source = "config.yaml", dest = "/usr/share/playtron/plugins/flatpak/config.yaml", mode = "644" },
]
auto-req = "no"


[dependencies]
base64 = "0.22.1"
chrono = "0.4.41"
env_logger = "0.11.6"
lazy_static = "1.5.0"
log = "0.4.26"
num-derive = "0.4.2"
num-traits = "0.2.19"
rand = "0.8"
rsa = {version="0.9.8", features=["sha2"]}
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
strum = "0.27.1"
strum_macros = "0.27.1"
thiserror = "2.0.12"
tokio = {version="1.44.2", features=["full"]}
zbus = { version = "5.5.0", default-features = false, features = ["tokio"] }
zbus_macros = "5.5.0"
zbus_names = "4.2.0"
serde_yaml = "0.9.34"
reqwest = {version="0.12.15", features=["json"]}
futures = "0.3.31"
futures-util = "0.3.31"
dirs = "6.0.0"
notify = "7"
quick-xml = "0.37"
flate2 = "1.1"

[dev-dependencies]
tokio = {version="1.44.2", features=["full"]}
